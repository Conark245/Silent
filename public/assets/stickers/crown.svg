<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
  </defs>
  <style>
    @keyframes crownShine {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .crown-body {
      animation: crownShine 2.5s ease-in-out infinite;
    }
  </style>
  <g class="crown-body">
    <path d="M30 150 L20 70 L65 105 L100 40 L135 105 L180 70 L170 150 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="4" stroke-linejoin="round" />
    <rect x="30" y="150" width="140" height="20" rx="5" fill="#DAA520" stroke="#B8860B" stroke-width="3" />
    <!-- Jewels -->
    <circle cx="100" cy="40" r="10" fill="#E60000" />
    <circle cx="20" cy="70" r="8" fill="#0080FF" />
    <circle cx="180" cy="70" r="8" fill="#0080FF" />
    <circle cx="100" cy="115" r="9" fill="#00C853" />
    <circle cx="60" cy="160" r="5" fill="#E60000" />
    <circle cx="100" cy="160" r="5" fill="#FFFFFF" />
    <circle cx="140" cy="160" r="5" fill="#E60000" />
  </g>
</svg>
